fragment PostParts on Post {
  __typename
  livePreview
  title
  draft
  date
  categories
  image
  excerpt
  body
  publishDate
  description
  featured
}

fragment PageParts on Page {
  __typename
  livePreview
  title
  layout
  image
  body
  showRegisterCta
  description
  draft
  blocks {
    __typename
    ... on PageBlocksHero {
      image
      heading
      text
      buttonLabel
      buttonUrl
      button2Label
      button2Url
      height
    }
    ... on PageBlocksText {
      heading
      text
      align
      width
      background
    }
    ... on PageBlocksImageText {
      image
      alt
      heading
      text
      buttonLabel
      buttonUrl
      imageSide
      background
    }
    ... on PageBlocksGallery {
      title
      perRow
      images {
        __typename
        src
        alt
        caption
      }
      background
    }
    ... on PageBlocksFeature {
      image
      eyebrow
      heading
      text
      buttonLabel
      buttonUrl
      linkLabel
      linkUrl
      background
    }
    ... on PageBlocksCta {
      heading
      text
      buttonLabel
      buttonUrl
      style
    }
    ... on PageBlocksVideo {
      url
      file
      caption
      background
    }
    ... on PageBlocksQuote {
      text
      author
      background
    }
    ... on PageBlocksPostGrid {
      title
      count
      category
      background
    }
    ... on PageBlocksFeaturedPost {
      title
      background
    }
    ... on PageBlocksCategoryTiles {
      title
      tiles {
        __typename
        label
        slug
        image
      }
      background
    }
    ... on PageBlocksFaq {
      title
      questions {
        __typename
        question
        answer
      }
      background
    }
    ... on PageBlocksColumns {
      title
      points {
        __typename
        icon
        heading
        text
      }
      background
    }
    ... on PageBlocksSpacer {
      size
    }
  }
}


fragment PostParts on Post {
  __typename
  title
  draft
  date
  categories
  image
  excerpt
  body
  publishDate
  description
  featured
}

fragment PageParts on Page {
  __typename
  title
  image
  body
  showRegisterCta
  description
  draft
}

fragment SettingsParts on Settings {
  __typename
  siteTitle
  logo
  tagline
  theme {
    __typename
    accent
    dark
    text
    soft
    headingFont
    bodyFont
  }
  nav {
    __typename
    label
    href
    children {
      __typename
      label
      href
    }
  }
  registerUrl
  announcement {
    __typename
    show
    text
    linkText
  }
  hero {
    __typename
    image
    title
    intro
  }
  classCard {
    __typename
    show
    image
    label
    title
    text
    buttonText
    stickyText
  }
  mobileCta
  recentPosts {
    __typename
    show
    title
    count
  }
  featuredTitle
  categoriesSection {
    __typename
    show
    title
    items {
      __typename
      label
      slug
      image
    }
  }
  footerText
  social {
    __typename
    label
    url
  }
}

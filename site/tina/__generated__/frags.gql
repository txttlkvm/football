fragment PostParts on Post {
  __typename
  title
  date
  categories
  image
  excerpt
  body
  draft
  publishDate
  description
  featured
}

fragment PageParts on Page {
  __typename
  title
  image
  body
  showRegisterCta
  description
  draft
}

fragment SettingsParts on Settings {
  __typename
  siteTitle
  tagline
  theme {
    __typename
    accent
    dark
    text
    soft
    headingFont
    bodyFont
  }
  nav {
    __typename
    label
    href
    children {
      __typename
      label
      href
    }
  }
  registerUrl
  announcement {
    __typename
    show
    text
    linkText
  }
  hero {
    __typename
    title
    intro
  }
  classCard {
    __typename
    show
    label
    title
    text
    buttonText
  }
  footerText
  social {
    __typename
    label
    url
  }
}

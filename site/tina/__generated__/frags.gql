fragment SettingsParts on Settings {
  __typename
  livePreview
  siteTitle
  logo
  tagline
  theme {
    __typename
    accent
    dark
    text
    soft
    headingFont
    bodyFont
  }
  nav {
    __typename
    label
    href
    children {
      __typename
      label
      href
    }
  }
  registerUrl
  announcement {
    __typename
    show
    text
    linkText
  }
  classCard {
    __typename
    label
    text
    buttonText
    stickyText
  }
  mobileCta
  footerText
  social {
    __typename
    label
    url
  }
}
